<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Kas OSIS</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #08122a, #020409);
      color: #fff;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    h1 {
      text-align: center;
      color: #00e0ff;
      text-shadow: 0 0 15px rgba(0,200,255,0.8);
      animation: fadeInUp 1s ease-out 0.5s forwards;
      opacity: 0;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .komisi {
      margin: 25px auto;
      padding: 20px;
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 15px;
      background: rgba(0,255,255,0.05);
      max-width: 700px;
      box-shadow: 0 0 15px rgba(0,255,255,0.2);
      animation: slideInBounce 1s ease-out forwards;
      opacity: 0;
      transform: translateX(-50px);
    }

    @keyframes slideInBounce {
      0% { opacity: 0; transform: translateX(-50px); }
      60% { opacity: 1; transform: translateX(10px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .komisi h2 {
      color: #00e0ff;
      border-bottom: 1px solid rgba(0,255,255,0.3);
      padding-bottom: 5px;
      transition: color 0.3s;
    }

    .komisi:hover h2 { color: #00aaff; }

    .anggota {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
      transition: background 0.3s, transform 0.2s;
      flex-wrap: wrap;
      gap: 5px;
    }

    .anggota:hover {
      background: rgba(0,255,255,0.1);
      transform: scale(1.02);
      border-radius: 5px;
    }

    .status { font-weight: bold; transition: all 0.3s; }
    .belum { color: #ff5757; }
    .sudah { color: #00ff99; }

    button {
      background: #00bfff;
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      font-size: 14px;
    }

    button:hover { box-shadow: 0 0 10px rgba(0,200,255,0.6); transform: scale(1.05); }
    button:active { transform: scale(0.95); }

    #notif {
      text-align: center;
      margin-top: 20px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-20px) scale(0.9);
      transition: all 0.5s;
      animation: notifBounce 0.5s ease-out;
    }

    @keyframes notifBounce {
      0% { transform: translateY(-20px) scale(0.9); }
      50% { transform: translateY(0) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }

    #notif.show { opacity: 1; transform: translateY(0) scale(1); }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    #logout-btn, #reset-btn {
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: 0.3s;
    }

    #logout-btn {
      background: #ff4444;
    }
    #logout-btn:hover {
      box-shadow: 0 0 20px rgba(255,68,68,0.8);
      transform: scale(1.1);
    }

    #reset-btn {
      background: #ffaa00;
    }
    #reset-btn:hover {
      box-shadow: 0 0 20px rgba(255,170,0,0.8);
      transform: scale(1.1);
    }

    /* === Popup konfirmasi === */
    #confirm-popup {
      display: flex;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #confirm-popup.show {
      opacity: 1;
      pointer-events: all;
    }
    #confirm-popup.hide {
      opacity: 0;
      pointer-events: none;
    }

    .confirm-box {
      background: #0c1a2e;
      border: 2px solid #00bfff;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0,200,255,0.4);
      padding: 25px;
      width: 90%;
      max-width: 350px;
      text-align: center;
      animation: popUp 0.4s ease-out;
    }

    @keyframes popUp {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .confirm-box h3 { margin-top: 0; color: #00e0ff; }
    .confirm-box p { color: #fff; margin: 10px 0 20px; font-size: 15px; }

    .confirm-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .confirm-buttons button {
      background: #00bfff;
      border: none;
      color: white;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    #confirm-yes { background: #ffaa00; }
    #confirm-yes:hover { box-shadow: 0 0 15px rgba(255,170,0,0.8); }
    #confirm-no { background: #555; }
    #confirm-no:hover { box-shadow: 0 0 15px rgba(255,255,255,0.3); }

    /* === Responsive for mobile === */
    @media (max-width: 600px) {
      body { padding: 10px; }
      .komisi { padding: 15px; margin: 15px auto; }
      .anggota { font-size: 14px; }
      button { font-size: 13px; padding: 5px 10px; }
      #reset-btn, #logout-btn { font-size: 14px; padding: 8px 15px; }
      .confirm-box { padding: 20px; }
      .confirm-box p { font-size: 14px; }
    }
  </style>
</head>
<body>
  <h1>💰 Sistem Kas OSIS</h1>
  <div id="komisi-container"></div>
  <div id="notif"></div>

  <div class="button-container">
    <button id="reset-btn">Reset All Status</button>
    <button id="logout-btn">Logout</button>
  </div>

  <!-- POPUP KONFIRMASI RESET -->
  <div id="confirm-popup">
    <div class="confirm-box">
      <h3>⚠️ Konfirmasi Reset</h3>
      <p>Apakah kamu yakin ingin mereset semua status menjadi <b>Belum Bayar</b>?</p>
      <div class="confirm-buttons">
        <button id="confirm-yes">Ya, Reset</button>
        <button id="confirm-no">Batal</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getDatabase, ref, get, update, set } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAvmSiSgfijLYb1_e8p1mf5rA8oaYpG1Y",
      authDomain: "osis-asstamayana.firebaseapp.com",
      databaseURL: "https://osis-asstamayana-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "osis-asstamayana",
      storageBucket: "osis-asstamayana.firebasestorage.app",
      messagingSenderId: "487901502731",
      appId: "1:487901502731:web:e0ed0778bb4c796bd2960e",
      measurementId: "G-TJ8W5XV0GH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const notif = document.getElementById("notif");
    const logoutBtn = document.getElementById("logout-btn");
    const resetBtn = document.getElementById("reset-btn");
    const confirmPopup = document.getElementById("confirm-popup");
    const confirmYes = document.getElementById("confirm-yes");
    const confirmNo = document.getElementById("confirm-no");

    function safePath(text) { return text.replace(/[.#$/()]/g, "_"); }

    const komisiData = {
      "Komisi Prestasi dan Akademik (KPA)": ["Kenzie Mirza Manggala", "Abyan Rafiandra Maheswara", "Satria Wicaksono", "Amanda Ayu Lestari", "Alitta Belicia Zanetha Tsary", "Nayla Zhafira M."],
      "Komisi Olahraga dan Seni (Korseni)": ["Akia Destin Kenzie Nararya", "Arbian Happy Fairuz", "Az Zahra Putri Langit", "Naura Mulya Arsyane", "Prabu Lingga Jatmika"],
      "Komisi Disiplin (Komdis)": ["Azka Muhammad Alfarizyq", "Desta Surya Prasetya", "Fauziah Kanaya Yusuf", "Sabrina Rigel Segoro", "Agha Akbar Azizi", "Malika Naajla Islammadina"],
      "Komisi Kerohanian Islam (Rohis)": ["Daffa Syadad Nur Faisal", "Ibrohim Abqori", "Rafeyfa Fachrya Hudi", "Naidah Tsabita Khairunnisa", "Faeya Hariz Sadewa", "Zayna Asfa Fawziya"],
      "Komisi Apresiasi dan Kreasi (APK)": ["Irsyad Pradipta Yuswardhana", "Meidianty Naila Azizah", "Belva Ayunindya Agata Sumarno", "Nadif Val’azzam Firdaus Bianca", "Zinedine Al Faruqi", "Janeta Humaira Rahadatul Aisy"],
      "Komisi Hubungan Masyarakat (Humas)": ["Mifzal Kanzie Raharjo", "Safira Faizah Adristi", "Habibah Dzakiyyah Ashidiq", "Riquel Zifdan Halevy", "Alif Irsyad Khoirullah", "Ayra Charissa Putri"]
    };

    const container = document.getElementById("komisi-container");

    async function manualReset() {
      try {
        const updates = [];
        for (const komisi of Object.keys(komisiData)) {
          for (const nama of komisiData[komisi]) {
            updates.push(update(ref(db, `kas/${safePath(komisi)}/${safePath(nama)}`), {
              status: "Belum Bayar",
              waktuBayar: "-"
            }));
          }
        }
        await Promise.all(updates);
        await set(ref(db, "kas/lastReset"), new Date().toISOString());
        notif.style.color = "#ffdd00";
        notif.textContent = "🔄 Semua status telah direset tanpa reload!";
        notif.classList.add("show");
        document.querySelectorAll(".status").forEach((s)=>{s.textContent="Belum Bayar";s.classList.add("belum");s.classList.remove("sudah");});
        setTimeout(()=>notif.classList.remove("show"),4000);
      } catch {
        notif.style.color = "#ff5757";
        notif.textContent = "❌ Terjadi kesalahan saat reset!";
        notif.classList.add("show");
        setTimeout(()=>notif.classList.remove("show"),4000);
      }
    }

    Object.keys(komisiData).forEach(async (komisi)=>{
      const div = document.createElement("div");
      div.classList.add("komisi");
      div.innerHTML = `<h2>${komisi}</h2>`;
      const anggotaList = komisiData[komisi];
      const dbRef = ref(db, `kas/${safePath(komisi)}`);
      const snapshot = await get(dbRef);
      const dataKas = snapshot.exists()?snapshot.val():{};
      anggotaList.forEach((nama)=>{
        const status = dataKas[safePath(nama)]?.status || "Belum Bayar";
        const row = document.createElement("div");
        row.classList.add("anggota");
        row.innerHTML = `<span>${nama}</span>
        <span class="status ${status==="Sudah Bayar"?"sudah":"belum"}">${status}</span>
        <button>Toggle</button>`;
        const btn = row.querySelector("button");
        const statusSpan = row.querySelector(".status");
        btn.addEventListener("click", async ()=>{
          const newStatus = statusSpan.textContent==="Sudah Bayar"?"Belum Bayar":"Sudah Bayar";
          const waktu = new Date().toLocaleString("id-ID");
          try{
            await update(ref(db,`kas/${safePath(komisi)}/${safePath(nama)}`),{status:newStatus,waktuBayar:newStatus==="Sudah Bayar"?waktu:"-"});
            statusSpan.textContent=newStatus;
            statusSpan.classList.toggle("sudah");
            statusSpan.classList.toggle("belum");
            notif.style.color=newStatus==="Sudah Bayar"?"#00ff99":"#ff5757";
            notif.textContent=newStatus==="Sudah Bayar"?`✅ ${nama} telah membayar (${waktu})`:`🔁 ${nama} diubah ke Belum Bayar`;
            notif.classList.add("show");
            setTimeout(()=>notif.classList.remove("show"),4000);
          }catch{
            notif.style.color="#ff5757";
            notif.textContent="❌ Gagal update data!";
            notif.classList.add("show");
            setTimeout(()=>notif.classList.remove("show"),4000);
          }
        });
        div.appendChild(row);
      });
      container.appendChild(div);
    });

    resetBtn.addEventListener("click",()=>{
      confirmPopup.classList.remove("hide");
      confirmPopup.classList.add("show");
    });

    confirmYes.addEventListener("click",async()=>{
      confirmPopup.classList.remove("show");
      confirmPopup.classList.add("hide");
      notif.style.color="#00e0ff";
      notif.textContent="⏳ Sedang mereset data...";
      notif.classList.add("show");
      await manualReset();
    });

    confirmNo.addEventListener("click",()=>{
      confirmPopup.classList.remove("show");
      confirmPopup.classList.add("hide");
    });

    logoutBtn.addEventListener("click", async () => {
  // hapus auth key role bendahara
  localStorage.removeItem('osis_bendahara_auth');

  // logout firebase
  await signOut(auth);

  // animasi fade out (biar smooth)
  document.body.style.transition = "opacity 0.5s ease";
  document.body.style.opacity = 0;

  // redirect ke halaman login
  setTimeout(() => {
    window.location.href = "admin.php";
  }, 500);
});

     // 🧱 Cek login
    const ok = localStorage.getItem('osis_bendahara_auth');
    if (ok !== 'true') {
      window.location.href = "admin.php";
    }

    // 🚪 Logout balik ke admin.php
    function logout() {
      localStorage.removeItem('osis_bendahara_auth');
      document.body.style.transition = "opacity 0.5s ease";
      document.body.style.opacity = 0;
      setTimeout(() => {
        window.location.href = "admin.php";
      }, 500);
    }
  </script>
</body>
</html>
